version: "3"

tasks:
  init:
    desc: Set up the development environment
    cmds:
      - git config core.hooksPath scripts/git-hooks
      - uv sync --locked

  check:
    desc: Run all automated checks
    cmds:
      - task: check-dogfood
      - task: check-template

  dogfood:
    desc: Regenerate flint's own agent instructions from the template
    # Generating from self, so dirty working-tree changes are expected and wanted.
    env:
      PYTHONWARNINGS: ignore:Dirty template changes:UserWarning
    cmds:
      - |
        tmp=$(mktemp -d)
        uv run copier copy --trust --skip-tasks --defaults --data language=python --data repo_size=single-package --vcs-ref=HEAD -q . "$tmp"
        cp "$tmp/AGENTS.md" AGENTS.md

  check-dogfood:
    desc: Verify flint's agent instructions match the template
    env:
      PYTHONWARNINGS: ignore:Dirty template changes:UserWarning
    cmds:
      - |
        tmp=$(mktemp -d)
        uv run copier copy --trust --skip-tasks --defaults --data language=python --data repo_size=single-package --vcs-ref=HEAD -q . "$tmp"
        diff AGENTS.md "$tmp/AGENTS.md"

  check-template:
    desc: Verify template variants and generated workflows
    env:
      PYTHONWARNINGS: ignore:Dirty template changes:UserWarning
    cmds:
      - bash scripts/check-template.sh

  new:
    desc: Create a new repository from the template
    cmds:
      - uv run copier copy --trust --vcs-ref=HEAD . {{.CLI_ARGS}}
